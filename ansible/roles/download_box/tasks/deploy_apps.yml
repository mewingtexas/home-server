---
- name: Assert ProtonVPN WireGuard private key is set
  ansible.builtin.assert:
    that:
      - vault_wireguard_private_key is defined
      - vault_wireguard_private_key | length > 0
      - vault_wireguard_private_key != "CHANGEME_SET_YOUR_PROTONVPN_WIREGUARD_PRIVATE_KEY"
    fail_msg: >-
      vault_wireguard_private_key is unset or still a placeholder.
      Set it in group_vars/media_stack/vault.yml and encrypt the file with ansible-vault.
    success_msg: "ProtonVPN WireGuard private key is present."

- name: Create download-box appdata root
  ansible.builtin.file:
    path: "{{ download_box_appdata }}"
    state: directory
    owner: "{{ download_box_puid }}"
    group: "{{ download_box_pgid }}"
    mode: "0755"

- name: Create per-service config directories
  ansible.builtin.file:
    path: "{{ download_box_appdata }}/{{ item }}"
    state: directory
    owner: "{{ download_box_puid }}"
    group: "{{ download_box_pgid }}"
    mode: "0755"
  loop:
    - gluetun
    - qbittorrent
    - prowlarr
    - sonarr
    - radarr

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ download_box_appdata }}/docker-compose.yml"
    owner: "{{ download_box_puid }}"
    group: "{{ download_box_pgid }}"
    mode: "0644"
  notify: Restart Media Stack

- name: Ensure media stack is up
  community.docker.docker_compose_v2:
    project_src: "{{ download_box_appdata }}"
    state: present
